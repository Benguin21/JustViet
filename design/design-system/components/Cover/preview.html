<!doctype html>
<html>
<head><meta charset="utf-8"><title>JustViet — cover</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--color-paper); position: relative; overflow: hidden; width: 960px; height: 288px; }
  svg { position: absolute; left: 0; top: 0; }
  .red { fill: var(--color-red-500); } .red-edge { fill: var(--color-red-700); }
  .yellow { fill: var(--color-yellow-400); } .yellow-edge { fill: var(--color-yellow-600); }
  .ink { fill: var(--color-ink-900); } .tint { fill: var(--color-red-100); }
  .green { fill: var(--color-success); } .green-edge { fill: var(--color-success-dark); }
  .paper { fill: var(--color-paper); }
  .t { position: absolute; left: 48px; bottom: 44px; max-width: 440px; }
  .name { font-family: var(--font-heading), sans-serif; font-weight: 800; font-size: 88px; line-height: .95; color: var(--color-ink-900); letter-spacing: -0.025em; margin: 0; }
  .tag { font-family: var(--font-body), sans-serif; font-size: 14px; font-weight: 600; color: var(--color-ink-500); margin: 12px 0 0; }
</style></head>
<body>
<!--
  blocks: color-red-500 tall slab 200x248 (radius-3xl), color-yellow-400 168x120 (radius-3xl), color-ink-900 120x104 (radius-3xl), color-red-100 relief 232x104 (radius-3xl), color-success small 64x64 disc
  arrangement: one tall red slab bleeding off the top, yellow and ink stacked beside it, a red-100 band bleeding off the right, all from x=520
  pattern: raised pills — each fill sits on its darker edge 4px lower (the Button's border-b-4), chosen because the README's depth rule is "a solid bottom edge, not a blur"
  steps/radii: gaps space-4 (16px) and space-6 (24px), edge offset 4px (space-1), radius-3xl 24px, pills radius-full
-->
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
  <rect class="red-edge" x="520" y="-24" width="200" height="252" rx="24"/>
  <rect class="red" x="520" y="-24" width="200" height="248" rx="24"/>
  <rect class="yellow-edge" x="736" y="-24" width="168" height="124" rx="24"/>
  <rect class="yellow" x="736" y="-24" width="168" height="120" rx="24"/>
  <rect class="tint" x="736" y="120" width="260" height="104" rx="24"/>
  <rect class="ink" x="920" y="-24" width="120" height="128" rx="24"/>
  <rect class="green-edge" x="760" y="148" width="64" height="52" rx="24"/>
  <rect class="green" x="760" y="144" width="64" height="52" rx="24"/>
  <rect class="red-edge" x="840" y="160" width="96" height="32" rx="16"/>
  <rect class="red" x="840" y="156" width="96" height="32" rx="16"/>
  <rect class="yellow-edge" x="544" y="244" width="152" height="32" rx="16"/>
  <rect class="yellow" x="544" y="240" width="152" height="32" rx="16"/>
  <rect class="red-edge" x="712" y="244" width="72" height="32" rx="16"/>
  <rect class="red" x="712" y="240" width="72" height="32" rx="16"/>
</svg>
<div class="t">
  <h1 class="name">JustViet</h1>
  <p class="tag">A friendly, bite-sized way to learn Vietnamese.</p>
</div>
</body>
</html>
